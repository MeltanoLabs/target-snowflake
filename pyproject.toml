[build-system]
requires = [
    "hatchling==1.32.0",
    "hatch-vcs==0.5",
]
build-backend = "hatchling.build"

[project]
name = "meltanolabs-target-snowflake"
dynamic = ["version"]
description = "Singer target for Snowflake, built with the Meltano SDK for Singer Targets."
authors = [{ name = "Ken Payne" }]
maintainers = [ { name = "Meltano Team and Community", email = "hello@meltano.com" } ]
requires-python = ">=3.10"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = [
    "ELT",
    "Snowflake",
]
classifiers = [
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "certifi==2026.7.22",
    "cryptography>=40",
    "pyarrow>=17",
    "pyhumps~=3.8.0",
    "singer-sdk[sql]==0.55.0b1",
    "snowflake-connector-python[secure-local-storage]~=4.0",
    "snowflake-sqlalchemy==1.11.1",
    "sqlalchemy~=2.0.31",
    "typing-extensions>=4.16.0 ; python_full_version < '3.12'",
]

[project.optional-dependencies]
# Snowpipe Streaming (`ingestion_method: snowpipe_streaming`) is opt-in: it pulls in a
# separate, Rust-backed package that most users don't need. Note snowpipe-streaming
# currently supports Python 3.9-3.13 only, so it isn't installable on Python 3.14.
snowpipe = ["snowpipe-streaming>=1.8.0"]

[project.scripts]
target-snowflake = "target_snowflake.target:TargetSnowflake.cli"
