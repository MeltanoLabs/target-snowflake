name: Test target-snowflake

on:
  push:
    branches: [main]
    paths:
    - .github/workflows/test.yml
    - .pytest.toml
    - target_snowflake/**
    - tests/**
    - uv.lock
    - tox.toml
  pull_request:
    branches: [main]
    paths:
    - .github/workflows/test.yml
    - target_snowflake/**
    - tests/**
    - uv.lock
    - tox.toml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  FORCE_COLOR: 1

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        python-version:
        - "3.14"
        - "3.10"

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      with:
        python-version: ${{ matrix.python-version }}
        version: ">=0.11"
    - name: Test with pytest
      env:
        SINGER_SDK_LOG_CONFIG: ./target_snowflake_logging.yaml
        TARGET_SNOWFLAKE_USER: ${{secrets.TARGET_SNOWFLAKE_USER}}
        TARGET_SNOWFLAKE_PRIVATE_KEY: ${{secrets.TARGET_SNOWFLAKE_PRIVATE_KEY}}
        TARGET_SNOWFLAKE_ACCOUNT: ${{secrets.TARGET_SNOWFLAKE_ACCOUNT}}
        TARGET_SNOWFLAKE_DATABASE: ${{secrets.TARGET_SNOWFLAKE_DATABASE}}
        TARGET_SNOWFLAKE_WAREHOUSE: ${{secrets.TARGET_SNOWFLAKE_WAREHOUSE}}
        TARGET_SNOWFLAKE_ROLE: ${{secrets.TARGET_SNOWFLAKE_ROLE}}
        TARGET_SNOWFLAKE_SCHEMA: ${{secrets.TARGET_SNOWFLAKE_SCHEMA}}
        PYTHON_VERSION: ${{ matrix.python-version }}
      run: |
        uvx --with tox-uv tox -e $PYTHON_VERSION
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: snowflake-logs-py${{ matrix.python-version }}-${{ matrix.os }}
        path: snowflake.log

  snowpipe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      with:
        version: ">=0.11"
    - name: Test Snowpipe Streaming with pytest
      env:
        SINGER_SDK_LOG_CONFIG: ./target_snowflake_logging.yaml
        TARGET_SNOWFLAKE_USER: ${{secrets.TARGET_SNOWFLAKE_USER}}
        TARGET_SNOWFLAKE_PRIVATE_KEY: ${{secrets.TARGET_SNOWFLAKE_PRIVATE_KEY}}
        TARGET_SNOWFLAKE_ACCOUNT: ${{secrets.TARGET_SNOWFLAKE_ACCOUNT}}
        TARGET_SNOWFLAKE_DATABASE: ${{secrets.TARGET_SNOWFLAKE_DATABASE}}
        TARGET_SNOWFLAKE_WAREHOUSE: ${{secrets.TARGET_SNOWFLAKE_WAREHOUSE}}
        TARGET_SNOWFLAKE_ROLE: ${{secrets.TARGET_SNOWFLAKE_ROLE}}
        TARGET_SNOWFLAKE_SCHEMA: ${{secrets.TARGET_SNOWFLAKE_SCHEMA}}
      run: |
        uvx --with tox-uv tox -e snowpipe
