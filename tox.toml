requires = [
    "tox>=4.51",
    "tox-uv",
]
env_list = [
    "typing",
    "test",
]

[env.test]
runner = "uv-venv-lock-runner"
description = "run tests on Python {py_dot_ver}"
base_python_file = [ ".python-version" ]

[env.snowpipe]
description = "run Snowpipe Streaming integration tests (requires the 'snowpipe' extra)"
# snowpipe-streaming doesn't yet support the project's default Python version; pin to
# one it does (3.9-3.13) rather than .python-version.
base_python = [ "3.12" ]
extras = [ "snowpipe" ]
pass_env = [ "TARGET_SNOWFLAKE_*" ]
commands = [ [ "pytest", "tests/test_snowpipe_streaming.py", { replace = "posargs", default = [ ], extend = true } ] ]

[env.typing]
description = "type checks"
deps = [
    "mypy>=1.20",
    "python-dotenv>=1.2",
    "pytest>=9",
    "ty>=0.0.30",
]
extras = [
    "snowpipe",
]
labels = [ "check" ]
commands = [
    [ "mypy", "target_snowflake", "tests" ],
    [ "ty", "check", "target_snowflake", "tests" ],
]

[env_run_base]
pass_env = [ "TARGET_SNOWFLAKE_*" ]
deps = [
    "coverage>=7.2.7",
    "python-dotenv>=1.2",
    "pytest>=9",
    "pytest-xdist>=3.3.1",
    "singer-sdk[testing]",
]
commands = [ [ "pytest", "-n=auto", { replace = "posargs", default = [ "tests" ], extend = true } ] ]
